# Builds Storybook and publishes it to GitHub Pages on every push to main.
#
# Nothing is built by hand and no build output is committed — GitHub installs
# the packages, runs `npm run build-storybook`, and serves the result. The
# shared link therefore always shows the latest pushed source.
#
# One-time setup in the repo: Settings → Pages → Source = "GitHub Actions".

name: Deploy Storybook

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without pushing anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, finish the newest one only.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins.
      - run: npm ci

      - run: npm run build-storybook

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
